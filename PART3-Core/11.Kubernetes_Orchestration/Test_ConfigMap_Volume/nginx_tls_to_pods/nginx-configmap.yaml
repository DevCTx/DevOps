apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-configmap
data:
  default.conf: |
    server {
      listen 443 ssl;
      http2 on;
      listen 443 quic reuseport;
      http3 on;
      add_header Alt-Svc 'h3=":443"; ma=86400';
      ssl_certificate     /etc/nginx/certs/tls.crt;
      ssl_certificate_key /etc/nginx/certs/tls.key;
      location / {
        root /usr/share/nginx/html;
      }
    }
