services:

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo-data:/data/db
    networks:
      - js-app-network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=password
      - ME_CONFIG_BASICAUTH_USERNAME=user
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017/
    volumes:
      - mongo-express-data:/data/config
    networks:
      - js-app-network

  js-app-db:
    build: .
    image: js-app-db:1.0
    container_name: js-app-db
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    environment:
      - MONGO_DB_URL=mongodb://admin:password@mongodb:27017
    networks:
      - js-app-network

volumes:
  mongo-data:
    name: mongo-data
    driver: local
  mongo-express-data:
    name: mongo-express-data
    driver: local

networks:
  js-app-network:
    name: js-app-network
    driver: bridge
